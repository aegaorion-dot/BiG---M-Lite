<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132238">
  <title>BiG-M Lite</title>
  <link rel="stylesheet" href="/v2/styles.css">
  <script src="/locale.js" defer></script>
  <script src="/v2/app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="/v2/" aria-label="BiG-M Lite home"><span class="brand-mark">B</span><span class="brand-copy"><strong>BiG-M</strong><small>Business, made clear</small></span></a>
      <div class="workspace-switcher" id="workspaceBadge" aria-live="polite"><span class="workspace-dot"></span><span><small id="workspaceLabel">Workspace</small><strong id="workspaceName">Loading…</strong></span><span class="workspace-chevron" aria-hidden="true">⌄</span></div>
      <nav class="primary-nav" id="primaryNav" aria-label="Primary"></nav>
      <div class="sidebar-bottom"><a class="sidebar-help" href="mailto:support@bigm.example" id="helpLink"><span aria-hidden="true">?</span><span data-i18n="help">Help & support</span></a></div>
    </aside>
    <div class="mobile-scrim" id="mobileScrim" hidden></div>
    <main class="main-column">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" aria-expanded="false"><span aria-hidden="true">☰</span></button>
        <div class="breadcrumbs"><span id="topWorkspace">Workspace</span><span aria-hidden="true">/</span><strong id="pageName">Home</strong></div>
        <div class="topbar-actions">
          <form class="search" id="globalSearch" role="search"><label class="sr-only" for="searchInput" data-i18n="search">Search</label><span aria-hidden="true">⌕</span><input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search transactions, documents…"><kbd>⌘ K</kbd></form>
          <span class="workspace-context" id="workspaceContext" aria-live="polite"></span>
          <label class="sr-only" for="languageSelect" data-i18n="language">Language</label><select class="language-select" id="languageSelect" aria-label="Language"></select>
          <button class="icon-button" id="notificationsButton" type="button" aria-label="Notifications" aria-expanded="false"><span aria-hidden="true">♧</span><span class="notification-count" id="notificationCount" hidden>0</span></button>
          <button class="profile-button" id="profileButton" type="button" aria-haspopup="true" aria-expanded="false"><span class="profile-avatar" id="profileAvatar">B</span><span class="profile-copy"><strong id="profileName">Business owner</strong><small id="profileRole">Workspace profile</small></span><span aria-hidden="true">⌄</span></button>
          <div class="popover notifications-popover" id="notificationsPopover" hidden></div>
          <div class="popover profile-popover" id="profilePopover" hidden><button type="button" data-page="settings" data-i18n="settings">Settings</button></div>
        </div>
      </header>
      <section id="pageContent" class="page-content" tabindex="-1" aria-live="polite"><div class="loading-card" role="status"><span class="spinner"></span><span data-i18n="loading">Loading your workspace…</span></div></section>
      <footer class="app-footer"><span>BiG-M Lite</span><span id="footerContext"></span><span><span class="service-dot" id="serviceDot"></span><span id="serviceStatus">Checking services</span></span></footer>
    </main>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  <dialog class="modal" id="transactionDialog" aria-labelledby="transactionTitle">
    <form id="transactionForm" method="dialog">
      <div class="modal-heading"><div><span class="eyebrow" data-i18n="recordActivity">Record activity</span><h2 id="transactionTitle" data-i18n="newTransaction">New transaction</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
      <div class="field-grid">
        <label><span data-i18n="type">Type</span><select name="kind"><option value="SALE" data-i18n="income">Income</option><option value="PURCHASE" data-i18n="expense">Expense</option></select></label>
        <label><span data-i18n="date">Date</span><input name="date" type="date" required></label>
        <label class="field-wide"><span data-i18n="description">Description</span><input name="description" required maxlength="180"></label>
        <label><span data-i18n="amount">Amount</span><input name="amountMajor" type="text" inputmode="decimal" required pattern="[0-9]+([.][0-9]{1,4})?"></label>
        <label><span data-i18n="counterparty">Customer / supplier</span><input name="counterparty" required maxlength="120"></label>
        <label class="field-wide"><span data-i18n="reference">Invoice / receipt reference</span><input name="reference" required maxlength="120"></label>
      </div>
      <p class="form-note" id="transactionCurrencyNote"></p><p class="form-error" id="transactionError" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="button button-secondary" data-close-dialog data-i18n="cancel">Cancel</button><button type="submit" class="button button-primary" id="transactionSubmit" data-i18n="saveForReview">Save for review</button></div>
    </form>
  </dialog>
  <dialog class="modal evidence-modal" id="evidenceDialog" aria-labelledby="evidenceTitle"><div class="modal-heading"><div><span class="eyebrow" data-i18n="sourceLineage">Source lineage</span><h2 id="evidenceTitle" data-i18n="evidence">Evidence</h2></div><button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button></div><div id="evidenceContent"></div></dialog>
  <template id="srOnlyTemplate"><span class="sr-only"></span></template>
</body>
</html>

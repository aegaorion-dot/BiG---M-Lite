<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>if(new URLSearchParams(location.search).get('lang')==='ar-MA'||navigator.language.startsWith('ar')){document.documentElement.lang='ar-MA';document.documentElement.dir='rtl';}</script>
<title>BiG-M Lite</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e2a47'/%3E%3Cpath d='M9 22V10h4.5a5 5 0 0 1 0 10H9zm4.5-8H11v6h2.5a3 3 0 0 0 0-6z' fill='%23e8b64c'/%3E%3C/svg%3E" />
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <div class="mark">B</div>
    <div>
      <p class="brand-name">BiG-M Lite</p>
            <p class="brand-sub" id="brandSub" hidden></p>
    </div>
  </div>
      <nav class="tabs" id="tabs" aria-label="Navigasi utama" hidden></nav>
  <div class="top-actions">
      <a class="btn ghost" href="/nikos-demo.html" lang="el">Επίδειξη Νίκου (Ελληνικά)</a>
      <select id="topLang" class="lang-select" aria-label="Language">
        <option value="ar-MA">الدارجة المغربية</option>
        <option value="en">English</option>
        <option value="id-ID">Bahasa Indonesia</option>
        <option value="en-AU">English (Australia)</option>
        <option value="en-SG">English (Singapore)</option>
        <option value="en-GB">English (United Kingdom)</option>
      </select>
          <span class="pill" id="auditPill" title="Status rantai audit" hidden>audit &middot;&middot;&middot;</span>
          <button class="btn ghost" id="demoBtn" type="button" hidden>Muat demo</button>
    </div>
</header>

<main class="shell">
  <p class="demo-note" id="demoNote" hidden>Menampilkan <strong>data demo</strong> (berlabel [DEMO]) — bukan data keuangan nyata.</p>
  <section id="view"></section>
</main>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<dialog id="txDialog">
  <form method="dialog" class="dlg" id="txForm">
    <h3 id="txTitle">Transaksi</h3>
    <div class="grid2">
      <label>ID<input name="id" required placeholder="sale-003" /></label>
      <label>Tanggal<input name="date" type="date" value="2026-08-01" required /></label>
      <label>Deskripsi<input name="description" required placeholder="Jasa / barang" /></label>
      <label>Nominal (IDR)<input name="amountMajor" required inputmode="decimal" placeholder="1500000" /></label>
      <label id="cpLabel">Pelanggan<input name="counterparty" required placeholder="PT …" /></label>
      <label>Referensi<input name="reference" required placeholder="INV / KW-…" /></label>
    </div>
    <p class="err" id="txErr" hidden></p>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" type="submit">Batal</button>
      <button class="btn gold" id="txSubmit" value="default" type="submit">Posting</button>
    </div>
  </form>
</dialog>

<dialog id="revDialog">
  <form method="dialog" class="dlg" id="revForm">
    <h3>Koreksi via Reversal</h3>
    <p class="muted">Jurnal asli tidak diubah. Sistem membuat jurnal pembalik baru yang seimbang.</p>
    <div class="grid2">
      <label>ID reversal<input name="id" required placeholder="rev-001" /></label>
      <label>Tanggal<input name="date" type="date" value="2026-08-02" required /></label>
    </div>
    <label>Memo<input name="memo" placeholder="Alasan koreksi" /></label>
    <p class="err" id="revErr" hidden></p>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" type="submit">Batal</button>
      <button class="btn gold" id="revSubmit" value="default" type="submit">Buat reversal</button>
    </div>
  </form>
</dialog>

<script src="/locale.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
